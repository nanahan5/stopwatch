<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>점메추 스탑워치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff4e2; --ink:#4a3428; --muted:#a98f7c; --card:#fffdf8; --line:#f1dfc6; --pick:#ff7a59; --go:#ff7a59; --stop:#6c5ce7; --tint:#ffe9c7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#241a14; --ink:#fbeedd; --muted:#b59d88; --card:#2f231b; --line:#463529; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; justify-content:center; padding:28px 16px 48px;
         background:var(--bg); color:var(--ink); font-family:"Jua","Malgun Gothic",sans-serif; }
  .wrap { width:100%; max-width:420px; text-align:center; }
  h1 { font-size:24px; font-weight:400; margin:4px 0 2px; }
  .sub { margin:0; color:var(--muted); font-size:14px; }

  .stage { position:relative; margin:22px auto 8px; width:min(78vw, 290px); aspect-ratio:1; border-radius:50%;
           background:var(--tint); transition:background .25s; display:grid; place-items:center;
           box-shadow:inset 0 -10px 0 rgba(0,0,0,.05); }
  .stage::after { content:""; position:absolute; inset:-10px; border-radius:50%; border:3px dashed var(--line); }
  .food { width:80%; }
  .food svg { width:100%; display:block; overflow:visible; }
  .running .food { animation:hop .32s ease-in-out infinite; }
  .popped .food { animation:pop .6s cubic-bezier(.3,1.6,.5,1); }
  @keyframes hop { 0%,100%{ transform:translateY(0) rotate(-3deg) } 50%{ transform:translateY(-12px) rotate(3deg) } }
  @keyframes pop { 0%{ transform:scale(.7) } 60%{ transform:scale(1.14) rotate(-4deg) } 100%{ transform:scale(1) } }
  .spark { position:absolute; left:50%; top:50%; width:12px; height:12px; margin:-6px; background:var(--pick);
           clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%); animation:fly .8s ease-out forwards; }
  @keyframes fly { to { transform:translate(var(--x), var(--y)) scale(.3) rotate(120deg); opacity:0; } }

  #msg { min-height:3.1em; margin:18px 0 6px; }
  #msg b { display:block; font-weight:400; font-size:26px; }
  #msg span { color:var(--muted); font-size:15px; }
  #msg b .big { color:var(--pick); font-size:inherit; }

  #time { font-size:clamp(46px, 14vw, 62px); line-height:1.1; margin:8px 0 22px; }
  #time i { display:inline-block; width:.62em; font-style:normal; text-align:center; }
  #time i.sep { width:.3em; }
  #time small { font-size:.5em; color:var(--muted); }
  #time small i { width:.62em; }

  .btns { display:flex; gap:12px; justify-content:center; }
  button { flex:1; max-width:170px; padding:14px; font:inherit; font-size:19px; border-radius:20px; cursor:pointer;
           border:2px solid var(--line); background:var(--card); color:var(--ink); box-shadow:0 4px 0 var(--line);
           transition:transform .08s, box-shadow .08s; }
  button:active:not(:disabled) { transform:translateY(3px); box-shadow:0 1px 0 var(--line); }
  button:disabled { opacity:.45; cursor:default; }
  button:focus-visible { outline:3px solid var(--stop); outline-offset:3px; }
  #start { background:var(--go); border-color:transparent; color:#fff; box-shadow:0 4px 0 #d9583a; }
  #start.running { background:var(--stop); box-shadow:0 4px 0 #4b3fb8; }

  ol { list-style:none; padding:0; margin:26px 0 0; text-align:left; }
  li { display:flex; gap:10px; align-items:center; padding:9px 12px; margin-bottom:8px; background:var(--card);
       border-radius:14px; border:2px solid var(--line); font-size:16px; }
  li .th { width:34px; height:34px; flex:none; }
  li .nm { flex:1; }
  li .tm { color:var(--muted); font-variant-numeric:tabular-nums; }
  .hint { margin-top:20px; color:var(--muted); font-size:13px; }
  @media (prefers-reduced-motion: reduce) { .running .food, .popped .food, .spark { animation:none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>점메추 스탑워치</h1>
  <p class="sub">멈추는 순간, 오늘의 점심이 정해져요</p>

  <div class="stage" id="stage"><div class="food" id="food"></div></div>
  <div id="msg" aria-live="polite"></div>
  <div id="time" role="timer"></div>

  <div class="btns">
    <button id="lap" disabled>후보 저장</button>
    <button id="start">시작</button>
  </div>
  <ol id="laps"></ol>
  <p class="hint">Space 시작/정지 · L 후보 저장 · R 리셋</p>
</div>

<script>
// ---------- 귀여운 얼굴 ----------
const face = (x, y, s = 1) => `<g transform="translate(${x},${y}) scale(${s})">
  <ellipse cx="-17" cy="6" rx="6" ry="3.6" fill="#ff8fa3" opacity=".55"/><ellipse cx="17" cy="6" rx="6" ry="3.6" fill="#ff8fa3" opacity=".55"/>
  <circle cx="-10" cy="0" r="3.4" fill="#3b2a20"/><circle cx="10" cy="0" r="3.4" fill="#3b2a20"/>
  <circle cx="-9" cy="-1.2" r="1.1" fill="#fff"/><circle cx="11" cy="-1.2" r="1.1" fill="#fff"/>
  <path d="M-4,5 Q0,11 4,5" stroke="#3b2a20" stroke-width="2.2" fill="none" stroke-linecap="round"/></g>`;
const shadow = '<ellipse cx="60" cy="110" rx="42" ry="6" fill="#000" opacity=".1"/>';
const svg = body => `<svg viewBox="0 0 120 120" aria-hidden="true">${shadow}${body}</svg>`;

const FOODS = [
  { n:'김밥', t:'#e4f4d0', m:'한 줄이면 든든!', s: svg(`
    <circle cx="60" cy="58" r="43" fill="#2b2b33"/><circle cx="60" cy="58" r="36" fill="#fffaf0"/>
    <circle cx="60" cy="36" r="6.5" fill="#ffc43d"/><circle cx="44" cy="43" r="5.5" fill="#ff8c42"/><circle cx="76" cy="43" r="5.5" fill="#6bbf59"/>
    <circle cx="60" cy="36" r="2.4" fill="#ffe08a"/>${face(60, 68)}`) },
  { n:'라면', t:'#ffe0d6', m:'후루룩~ 국물이 땡길 때', s: svg(`
    <path d="M38 26 Q32 18 38 10 M58 26 Q52 18 58 8 M78 26 Q72 18 78 10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".8"/>
    <path d="M16 62 H104 Q104 106 60 106 Q16 106 16 62Z" fill="#e9573f"/>
    <path d="M24 62 Q34 30 46 60 Q58 28 70 60 Q82 30 96 62Z" fill="#ffd36b" stroke="#e7a93a" stroke-width="3" stroke-linejoin="round"/>
    <rect x="12" y="58" width="96" height="9" rx="4.5" fill="#f48a76"/>
    <ellipse cx="86" cy="52" rx="14" ry="10" fill="#fff"/><circle cx="86" cy="52" r="6" fill="#ffb703"/>
    <circle cx="36" cy="54" r="2.4" fill="#6bbf59"/><circle cx="50" cy="50" r="2.4" fill="#6bbf59"/>${face(56, 86)}`) },
  { n:'떡볶이', t:'#ffd9cf', m:'매콤달콤 오늘은 이거!', s: svg(`
    <ellipse cx="60" cy="92" rx="52" ry="17" fill="#fff" stroke="#f1dfc6" stroke-width="2"/>
    <rect x="12" y="62" width="54" height="26" rx="13" fill="#ee4a33" transform="rotate(-14 39 75)"/>
    <rect x="54" y="58" width="54" height="26" rx="13" fill="#ee4a33" transform="rotate(14 81 71)"/>
    <rect x="30" y="44" width="60" height="38" rx="19" fill="#ff6347"/>
    <path d="M40 52 Q60 46 80 52" stroke="#ff9a85" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="26" cy="72" r="1.8" fill="#ffe9c7"/><circle cx="96" cy="68" r="1.8" fill="#ffe9c7"/>${face(60, 68)}`) },
  { n:'돈까스', t:'#ffedc2', m:'바삭바삭 실패 없는 선택', s: svg(`
    <ellipse cx="60" cy="92" rx="52" ry="14" fill="#8fd16a"/>
    <path d="M22 70 Q20 36 60 34 Q100 36 98 70 Q96 98 60 98 Q24 98 22 70Z" fill="#eaa63e" stroke="#c27a1f" stroke-width="3"/>
    <path d="M34 50 Q44 42 54 50 T76 48 T90 54" stroke="#7a3b1d" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="34" cy="72" r="1.6" fill="#c27a1f"/><circle cx="88" cy="76" r="1.6" fill="#c27a1f"/><circle cx="60" cy="90" r="1.6" fill="#c27a1f"/>${face(60, 74)}`) },
  { n:'비빔밥', t:'#f6e7d3', m:'쓱싹쓱싹 비벼 먹자', s: svg(`
    <path d="M14 58 H106 Q106 106 60 106 Q14 106 14 58Z" fill="#d98c5f"/>
    <ellipse cx="60" cy="58" rx="47" ry="15" fill="#fffaf0" stroke="#c9763f" stroke-width="3"/>
    <ellipse cx="32" cy="56" rx="10" ry="4.5" fill="#6bbf59"/><ellipse cx="88" cy="56" rx="10" ry="4.5" fill="#ff8c42"/>
    <ellipse cx="44" cy="65" rx="9" ry="3.8" fill="#8b5a3c"/><ellipse cx="76" cy="65" rx="9" ry="3.8" fill="#f3d35a"/>
    <ellipse cx="60" cy="52" rx="16" ry="9" fill="#fff"/><circle cx="60" cy="51" r="6" fill="#ffb703"/>${face(60, 86)}`) },
  { n:'초밥', t:'#dff1f7', m:'깔끔하게 한 입씩', s: svg(`
    <rect x="22" y="62" width="76" height="36" rx="18" fill="#fffaf0" stroke="#e8dcc6" stroke-width="2"/>
    <path d="M14 64 Q60 22 106 64 Q60 78 14 64Z" fill="#ff8a5c"/>
    <path d="M36 54 Q42 46 50 42 M58 50 Q64 42 72 40 M80 54 Q86 48 92 48" stroke="#ffd3bd" stroke-width="3.2" fill="none" stroke-linecap="round"/>${face(60, 84)}`) },
  { n:'햄버거', t:'#fff0c9', m:'빠르고 든든하게', s: svg(`
    <path d="M20 90 H100 Q100 106 84 106 H36 Q20 106 20 90Z" fill="#e0a458"/>
    <rect x="16" y="74" width="88" height="17" rx="8.5" fill="#7a4a2e"/>
    <path d="M18 70 H102 L94 86 L82 73 L68 88 L54 73 L40 86 L30 73Z" fill="#ffcf3f"/>
    <path d="M14 66 Q24 56 34 66 T54 66 T74 66 T94 66 T106 66 V72 H14Z" fill="#7cc95f"/>
    <path d="M18 64 Q18 20 60 20 Q102 20 102 64Z" fill="#f0b45e"/>
    <ellipse cx="38" cy="34" rx="3" ry="1.6" fill="#fff3d6"/><ellipse cx="80" cy="32" rx="3" ry="1.6" fill="#fff3d6"/><ellipse cx="60" cy="27" rx="3" ry="1.6" fill="#fff3d6"/>${face(60, 48)}`) },
  { n:'피자', t:'#ffe3c2', m:'한 조각만 더?', s: svg(`
    <path d="M14 30 Q60 14 106 30 L60 108Z" fill="#ffcf5c" stroke="#e0a030" stroke-width="3" stroke-linejoin="round"/>
    <path d="M12 28 Q60 8 108 28 Q110 40 100 40 Q60 26 20 40 Q10 40 12 28Z" fill="#e8a850"/>
    <circle cx="38" cy="50" r="7" fill="#e4503a"/><circle cx="84" cy="50" r="7" fill="#e4503a"/><circle cx="60" cy="92" r="5" fill="#e4503a"/>${face(60, 66)}`) },
];

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const stage = $('stage'), foodEl = $('food'), msg = $('msg'), timeEl = $('time');
const startBtn = $('start'), lapBtn = $('lap'), lapsEl = $('laps');
const pad = n => String(n).padStart(2, '0');
const chars = s => [...s].map(c => `<i${c === ':' ? ' class="sep"' : ''}>${c}</i>`).join('');
function fmt(ms) {
  const m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60, cs = Math.floor(ms / 10) % 100;
  return [`${pad(m)}:${pad(s)}`, pad(cs)];
}
const fmtText = ms => fmt(ms).join('.');
const foodAt = ms => FOODS[Math.floor(ms / 140) % FOODS.length];

let elapsed = 0, startedAt = 0, running = false, raf = 0, lapCount = 0, shown = null;
const now = () => elapsed + (running ? performance.now() - startedAt : 0);

function show(food) {
  if (food === shown) return;
  shown = food; foodEl.innerHTML = food.s; stage.style.setProperty('--tint', food.t);
}
function setMsg(html) { msg.innerHTML = html; }

function render() {
  const t = now(), [a, b] = fmt(t);
  timeEl.innerHTML = `${chars(a)}<small>.${chars(b)}</small>`;
  if (running) show(foodAt(t));
}
function tick() { render(); if (running) raf = requestAnimationFrame(tick); }

function sparkle() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let k = 0; k < 10; k++) {
    const e = document.createElement('div'), ang = k / 10 * Math.PI * 2, r = 130 + Math.random() * 30;
    e.className = 'spark'; e.style.setProperty('--x', Math.cos(ang) * r + 'px'); e.style.setProperty('--y', Math.sin(ang) * r + 'px');
    e.style.background = ['#ff7a59', '#ffc43d', '#6c5ce7', '#6bbf59'][k % 4];
    stage.appendChild(e); setTimeout(() => e.remove(), 850);
  }
}
function syncButtons() {
  startBtn.textContent = running ? '멈춰!' : (elapsed ? '계속' : '시작');
  startBtn.classList.toggle('running', running);
  lapBtn.textContent = running || !elapsed ? '후보 저장' : '리셋';
  lapBtn.disabled = !running && !elapsed;
}
function toggle() {
  if (running) {
    elapsed = now(); running = false; cancelAnimationFrame(raf);
    stage.classList.remove('running'); stage.classList.remove('popped'); void stage.offsetWidth; stage.classList.add('popped');
    const f = foodAt(elapsed); show(f); sparkle();
    setMsg(`<b>오늘 점심은 <span class="big">${f.n}</span>!</b><span>${f.m}</span>`);
    render();
  } else {
    startedAt = performance.now(); running = true;
    stage.classList.remove('popped'); stage.classList.add('running');
    setMsg(`<b>뭐가 걸릴까…?</b><span>마음에 드는 순간 멈춰요</span>`);
    tick();
  }
  syncButtons();
}
function lap() {
  const t = now(), f = foodAt(t), li = document.createElement('li');
  li.innerHTML = `<div class="th">${f.s}</div><span class="nm">후보 ${++lapCount} · ${f.n}</span><span class="tm">${fmtText(t)}</span>`;
  lapsEl.prepend(li);
}
function reset() {
  elapsed = lapCount = 0; lapsEl.innerHTML = ''; stage.classList.remove('popped'); shown = null;
  show(FOODS[0]); setMsg(`<b>배고픈 시간!</b><span>시작을 누르고, 멈추는 순간 점심이 정해져요</span>`);
  render(); syncButtons();
}
startBtn.onclick = toggle;
lapBtn.onclick = () => running ? lap() : reset();
document.addEventListener('keydown', e => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (e.code === 'Space') { e.preventDefault(); document.activeElement.blur?.(); toggle(); }
  else if (k === 'l' && running) lap();
  else if (k === 'r' && !running && elapsed) reset();
});
reset();
</script>
</body>
</html>
